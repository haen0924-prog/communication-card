<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>의사소통 카드</title>
<!-- 링크 미리보기 (OG 태그) -->
<meta property="og:title" content="의사소통 카드">
<meta property="og:description" content="청각장애인을 위한 의사소통 도우미 · Communication aid for the deaf">
<meta property="og:image" content="https://communication-card.vercel.app/icon.png">
<meta property="og:url" content="https://communication-card.vercel.app">
<meta property="og:type" content="website">

<!-- 앱 아이콘 -->
<link rel="icon" href="icon.png">
<link rel="apple-touch-icon" href="icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="의사소통 카드">
<meta name="theme-color" content="#0ea5e9">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;600;700;900&display=swap" rel="stylesheet">
<style>
  /* ===== 실시간 자막 전체화면 ===== */
  .caption-screen {
    display: none;
    position: fixed;
    inset: 0;
    z-index: 8000;
    background: #0f172a;
    flex-direction: column;
  }
  .caption-screen.show { display: flex; animation: fadeIn 0.2s ease; }

  .caption-modal {
    background: #0f172a;
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  .caption-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 18px 20px 14px;
    background: #1e293b;
    border-bottom: 1px solid #334155;
    flex-shrink: 0;
  }

  .caption-header-title {
    font-size: 15px;
    font-weight: 700;
    color: #fff;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .caption-status {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 13px;
    color: #94a3b8;
    font-weight: 600;
  }

  .caption-status .dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: #4ade80;
    animation: blink 1s infinite;
  }
  .caption-status .dot.off { background: #475569; animation: none; }

  @keyframes blink {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.2; }
  }

  .caption-close-btn {
    width: 34px;
    height: 34px;
    border-radius: 50%;
    border: 2px solid #475569;
    background: transparent;
    color: #94a3b8;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .caption-close-btn:active { background: #334155; }

  /* 자막 표시 영역 */
  .caption-body {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 32px 28px 24px;
    overflow: hidden;
  }

  .caption-final {
    font-size: var(--caption-font-size, 52px);
    font-weight: 800;
    color: #ffffff;
    line-height: 1.4;
    text-align: center;
    word-break: keep-all;
    max-height: 60vh;
    overflow-y: auto;
    width: 100%;
    transition: font-size 0.15s;
  }

  .caption-interim {
    font-size: calc(var(--caption-font-size, 52px) * 0.65);
    font-weight: 600;
    color: #64748b;
    line-height: 1.4;
    text-align: center;
    min-height: 44px;
    word-break: keep-all;
    margin-top: 16px;
    width: 100%;
    transition: font-size 0.15s;
  }

  /* ===== 자막 번역 결과 영역 ===== */
  .caption-translation-area {
    padding: 0 20px 12px;
    background: #0f172a;
    flex-shrink: 0;
  }
  .caption-translation-result {
    background: #1e3a5f;
    border-radius: 12px;
    padding: 14px 16px;
    display: none;
  }
  .caption-translation-result.show { display: block; animation: fadeIn 0.2s ease; }
  .caption-translation-lang-badge {
    font-size: 12px;
    color: #38bdf8;
    font-weight: 700;
    margin-bottom: 6px;
  }
  .caption-translation-text {
    font-size: 20px;
    font-weight: 700;
    color: #fff;
    line-height: 1.4;
    word-break: keep-all;
  }
  .caption-translation-btns {
    display: flex;
    gap: 8px;
    padding: 0 20px 10px;
    flex-shrink: 0;
    flex-wrap: wrap;
  }
  .caption-translate-btn {
    flex: 1;
    min-width: 60px;
    padding: 9px 6px;
    border-radius: 10px;
    border: 2px solid #334155;
    background: #1e293b;
    color: #94a3b8;
    font-family: inherit;
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.2s;
    text-align: center;
  }
  .caption-translate-btn:active { background: #334155; }
  .caption-translate-btn.active {
    border-color: #38bdf8;
    background: rgba(56,189,248,0.15);
    color: #38bdf8;
  }
  .caption-translate-btn.loading { opacity: 0.6; }

  /* 글자 크기 조절 바 */
  .caption-size-bar {
    padding: 10px 20px 14px;
    background: #1e293b;
    border-top: 1px solid #334155;
    display: flex;
    align-items: center;
    gap: 12px;
    flex-shrink: 0;
  }
  .caption-size-label {
    font-size: 13px;
    color: #94a3b8;
    font-weight: 600;
    white-space: nowrap;
  }
  .caption-size-slider {
    flex: 1;
    -webkit-appearance: none;
    appearance: none;
    height: 6px;
    border-radius: 3px;
    background: #334155;
    outline: none;
    cursor: pointer;
  }
  .caption-size-slider::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 22px;
    height: 22px;
    border-radius: 50%;
    background: #4ade80;
    cursor: pointer;
    border: 2px solid #0f172a;
  }
  .caption-size-value {
    font-size: 13px;
    font-weight: 700;
    color: #4ade80;
    min-width: 36px;
    text-align: right;
  }

  /* 하단 버튼 바 */
  .caption-footer {
    padding: 12px 20px 28px;
    background: #1e293b;
    border-top: 1px solid #334155;
    display: flex;
    gap: 10px;
    flex-shrink: 0;
  }

  .btn-caption-toggle {
    flex: 1;
    padding: 16px;
    border-radius: 14px;
    border: none;
    background: #4ade80;
    color: #0f172a;
    font-family: inherit;
    font-size: 17px;
    font-weight: 800;
    cursor: pointer;
    transition: all 0.2s;
  }
  .btn-caption-toggle.listening {
    background: #f87171;
    color: #fff;
  }
  .btn-caption-toggle:active { opacity: 0.85; }

  .btn-caption-clear {
    padding: 16px 20px;
    border-radius: 14px;
    border: 2px solid #475569;
    background: transparent;
    color: #94a3b8;
    font-family: inherit;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
  }
  .btn-caption-clear:active { background: #1e293b; }

  /* 자막 실행 버튼 */
  .caption-launch-btn {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    width: 100%;
    padding: 13px 16px;
    border-radius: 14px;
    border: 2px solid #4ade80;
    background: rgba(74,222,128,0.08);
    color: #16a34a;
    font-family: inherit;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.2s;
  }
  .caption-launch-btn:active { background: rgba(74,222,128,0.2); }




  .version-overlay {
    display: none;
    position: fixed;
    inset: 0;
    z-index: 9999;
    background: var(--bg);
    overflow-y: auto;
    padding: 32px 16px 40px;
  }
  .version-overlay.show { display: block; animation: fadeIn 0.2s ease; }

  .version-title {
    text-align: center;
    font-size: 22px;
    font-weight: 900;
    color: var(--text);
    margin-bottom: 6px;
  }
  .version-subtitle {
    text-align: center;
    font-size: 13px;
    color: var(--text-muted);
    margin-bottom: 28px;
  }

  .version-cards {
    display: flex;
    flex-direction: column;
    gap: 20px;
    max-width: 400px;
    margin: 0 auto;
  }

  .version-card {
    background: var(--surface);
    border: 3px solid var(--border);
    border-radius: 20px;
    padding: 20px;
    cursor: pointer;
    transition: all 0.2s;
  }
  .version-card:active { transform: scale(0.97); }
  .version-card.selected { border-color: var(--accent2); }

  .version-card-title {
    font-size: 17px;
    font-weight: 800;
    color: var(--text);
    margin-bottom: 12px;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  /* 미리보기 카드 그리드 */
  .preview-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 8px;
    margin-bottom: 14px;
  }
  .preview-card {
    background: var(--card);
    border: 1.5px solid var(--border);
    border-radius: 10px;
    padding: 10px 8px;
    text-align: center;
    min-height: 70px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 4px;
  }
  .preview-card .pe { font-size: 26px; line-height: 1; }
  .preview-card .pt { font-size: 11px; font-weight: 600; color: var(--text); line-height: 1.3; }

  .version-lang-bar {
    display: flex;
    justify-content: center;
    gap: 8px;
    flex-wrap: wrap;
    margin-bottom: 20px;
  }
  .version-lang-btn {
    padding: 8px 16px;
    border-radius: 50px;
    border: 2px solid var(--border);
    background: transparent;
    color: var(--text-muted);
    font-family: inherit;
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.2s;
  }
  .version-lang-btn.active {
    background: var(--accent2);
    border-color: var(--accent2);
    color: #fff;
  }
  .version-lang-btn:active { opacity: 0.8; }


  .btn-select-version {
    display: block;
    width: 100%;
    padding: 14px;
    border-radius: 50px;
    border: none;
    background: #1a237e;
    color: #ffe600;
    font-family: inherit;
    font-size: 16px;
    font-weight: 800;
    cursor: pointer;
    letter-spacing: 0.3px;
    transition: opacity 0.2s;
  }
  .btn-select-version:active { opacity: 0.8; }

  /* 헤더 버전 변경 버튼 */
  .btn-change-version {
    margin-top: 6px;
    padding: 4px 12px;
    border-radius: 50px;
    border: 1.5px solid rgba(255,255,255,0.3);
    background: transparent;
    color: rgba(255,255,255,0.8);
    font-family: inherit;
    font-size: 11px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.15s;
  }
  .btn-change-version:active { background: rgba(255,255,255,0.15); }


  :root {
    --bg: #f0f4f8;
    --surface: #ffffff;
    --card: #ffffff;
    --accent: #0284c7;
    --accent2: #db2777;
    --accent3: #16a34a;
    --text: #1e293b;
    --text-muted: #64748b;
    --border: #cbd5e1;
    --radius: 16px;
    --card-text-size: 13px;
    --card-emoji-size: 36px;
    --card-min-height: 100px;
  }

  /* 카드 라이트 스타일 */
  .card {
    box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    border-color: #e2e8f0;
  }
  .card:active {
    background: #e0f2fe;
    border-color: var(--accent);
  }

  /* ===== 큰 글씨 모드 ===== */
  body.font-lg {
    --card-text-size: 17px;
    --card-emoji-size: 44px;
    --card-min-height: 130px;
  }

  body.font-lg .card-grid {
    grid-template-columns: repeat(2, 1fr);
  }

  body.font-lg .section-title {
    font-size: 19px;
  }

  body.font-lg .tab {
    font-size: 13px;
    padding: 7px 14px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Noto Sans KR', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    padding-bottom: 80px;
    transition: background 0.3s, color 0.3s;
  }

  header {
    background: linear-gradient(135deg, #0ea5e9 0%, #6366f1 50%, #ec4899 100%);
    padding: 14px 16px 10px;
    text-align: center;
    position: sticky;
    top: 0;
    z-index: 100;
    box-shadow: 0 4px 20px rgba(0,0,0,0.4);
  }

  header h1 {
    font-size: 20px;
    font-weight: 900;
    letter-spacing: -0.5px;
  }

  header p {
    font-size: 12px;
    opacity: 0.85;
    margin-top: 2px;
  }

  /* 설정 바 */
  .settings-bar {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    padding: 8px 16px;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    flex-wrap: wrap;
  }

  .settings-label {
    font-size: 12px;
    color: var(--text-muted);
    font-weight: 600;
  }

  .toggle-group {
    display: flex;
    gap: 4px;
    background: var(--bg);
    border-radius: 50px;
    padding: 3px;
    border: 1px solid var(--border);
  }

  .toggle-btn {
    padding: 5px 14px;
    border-radius: 50px;
    border: none;
    background: transparent;
    color: var(--text-muted);
    font-family: inherit;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s;
    white-space: nowrap;
  }

  .toggle-btn.active {
    background: var(--accent);
    color: #fff;
  }

  .divider {
    width: 1px;
    height: 20px;
    background: var(--border);
  }

  .search-bar {
    padding: 12px 16px;
    background: var(--surface);
    position: sticky;
    top: 72px;
    z-index: 99;
  }

  .search-bar input {
    width: 100%;
    padding: 10px 16px;
    border-radius: 50px;
    border: 2px solid var(--border);
    background: var(--card);
    color: var(--text);
    font-family: inherit;
    font-size: 14px;
    outline: none;
    transition: border-color 0.2s;
  }

  .search-bar input:focus {
    border-color: var(--accent);
  }

  .search-bar input::placeholder {
    color: var(--text-muted);
  }

  /* 카테고리 탭 */
  .tabs {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    padding: 10px 12px;
    background: var(--surface);
    justify-content: center;
  }

  .tab {
    flex: 0 0 auto;
    padding: 6px 12px;
    border-radius: 50px;
    border: 2px solid var(--border);
    background: transparent;
    color: var(--text-muted);
    font-family: inherit;
    font-size: 12px;
    cursor: pointer;
    transition: all 0.2s;
    white-space: nowrap;
  }

  .tab.active {
    background: var(--accent);
    border-color: var(--accent);
    color: #0f172a;
    font-weight: 700;
  }

  /* 카테고리 섹션 */
  .section {
    padding: 16px 16px 8px;
  }

  .section-title {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 16px;
    font-weight: 700;
    margin-bottom: 12px;
    color: var(--accent);
  }

  .section-title .emoji {
    font-size: 22px;
  }

  /* 카드 그리드 */
  .card-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 10px;
  }

  .card {
    background: var(--card);
    border-radius: var(--radius);
    padding: 14px 12px;
    cursor: pointer;
    border: 2px solid transparent;
    transition: all 0.15s;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    gap: 8px;
    min-height: var(--card-min-height);
    position: relative;
    overflow: hidden;
  }

  .card::before {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(135deg, transparent 60%, rgba(56,189,248,0.05));
    pointer-events: none;
  }

  .card:active {
    transform: scale(0.96);
    border-color: var(--accent);
    background: #e0f2fe;
  }

  .card .card-emoji {
    font-size: var(--card-emoji-size);
    line-height: 1;
  }

  .card .card-text {
    font-size: var(--card-text-size);
    font-weight: 600;
    line-height: 1.4;
    color: var(--text);
  }

  /* 큰 카드 표시 모달 */
  .display-modal {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.92);
    z-index: 1000;
    justify-content: center;
    align-items: center;
    padding: 24px;
    cursor: pointer;
  }

  .display-modal.show {
    display: flex;
    animation: fadeIn 0.15s ease;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: scale(0.95); }
    to { opacity: 1; transform: scale(1); }
  }

  .display-card {
    background: white;
    border-radius: 24px;
    padding: 48px 20px 28px;
    text-align: center;
    max-width: 95vw;
    width: 100%;
    box-shadow: 0 25px 60px rgba(0,0,0,0.5);
  }

  /* 모달 닫기 X 버튼 */
  .modal-close-btn {
    position: absolute;
    top: 14px;
    right: 14px;
    width: 36px;
    height: 36px;
    border-radius: 50%;
    border: 2px solid #cbd5e1;
    background: transparent;
    color: #94a3b8;
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.15s;
  }
  .modal-close-btn:active {
    background: #334155;
    color: #f1f5f9;
  }

  .display-card { position: relative; }

  .display-card .big-emoji {
    font-size: 120px;
    line-height: 1;
    margin-bottom: 20px;
    display: block;
  }

  .display-card .big-text {
    font-size: 25px;
    font-weight: 500;
    color: #0f172a;
    line-height: 1.2;
    margin-bottom: 12px;
    word-break: keep-all;
  }

  .display-card .tap-hint {
    font-size: 13px;
    color: #94a3b8;
  }

  /* ===== 모달 번역 버튼 영역 ===== */
  .modal-translate-section {
    margin-top: 14px;
    border-top: 1px solid #e2e8f0;
    padding-top: 14px;
  }
  .modal-translate-label {
    font-size: 11px;
    color: #94a3b8;
    font-weight: 600;
    margin-bottom: 8px;
    text-align: center;
  }
  .modal-translate-btns {
    display: flex;
    gap: 8px;
    justify-content: center;
    flex-wrap: wrap;
  }
  .modal-translate-btn {
    padding: 8px 16px;
    border-radius: 50px;
    border: 2px solid #cbd5e1;
    background: transparent;
    color: #475569;
    font-family: inherit;
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.2s;
  }
  .modal-translate-btn:active { opacity: 0.75; }
  .modal-translate-btn.active {
    border-color: #0284c7;
    background: #eff6ff;
    color: #0284c7;
  }
  .modal-translate-btn.loading {
    opacity: 0.5;
    pointer-events: none;
  }
  /* 번역 결과 박스 */
  .modal-translation-box {
    display: none;
    margin-top: 12px;
    background: #f0f9ff;
    border: 2px solid #bae6fd;
    border-radius: 14px;
    padding: 14px 16px;
    text-align: center;
  }
  .modal-translation-box.show { display: block; animation: fadeIn 0.2s ease; }
  .modal-translation-lang {
    font-size: 11px;
    color: #0284c7;
    font-weight: 700;
    margin-bottom: 5px;
  }
  .modal-translation-text {
    font-size: 20px;
    font-weight: 700;
    color: #0f172a;
    line-height: 1.4;
    word-break: keep-all;
  }
  .modal-translation-speak-btn {
    margin-top: 10px;
    padding: 7px 20px;
    border-radius: 50px;
    border: 2px solid #0284c7;
    background: transparent;
    color: #0284c7;
    font-family: inherit;
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.2s;
  }
  .modal-translation-speak-btn:active { background: #eff6ff; }

  /* 직접 입력 섹션 */
  .custom-section {
    padding: 16px;
    margin: 8px 16px 16px;
    background: var(--card);
    border-radius: var(--radius);
    border: 2px dashed var(--border);
  }

  .custom-title {
    font-size: 15px;
    font-weight: 700;
    color: var(--accent2);
    margin-bottom: 10px;
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .custom-inputs {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .custom-input-row {
    display: flex;
    gap: 8px;
  }

  .custom-inputs input {
    flex: 1;
    padding: 10px 14px;
    border-radius: 10px;
    border: 2px solid var(--border);
    background: var(--surface);
    color: var(--text);
    font-family: inherit;
    font-size: 14px;
    outline: none;
  }

  .custom-inputs input:focus {
    border-color: var(--accent2);
  }

  .custom-inputs input::placeholder {
    color: var(--text-muted);
  }

  .emoji-input {
    width: 60px !important;
    flex: none !important;
    text-align: center;
    font-size: 22px !important;
  }

  .btn-show {
    padding: 10px 18px;
    border-radius: 10px;
    border: none;
    background: var(--accent2);
    color: white;
    font-family: inherit;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    transition: opacity 0.2s;
    white-space: nowrap;
  }

  .btn-show:active { opacity: 0.8; }

  /* 저장된 커스텀 카드들 */
  .saved-custom {
    margin-top: 10px;
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }

  .saved-chip {
    display: flex;
    align-items: center;
    gap: 6px;
    background: var(--surface);
    border: 2px solid var(--border);
    border-radius: 50px;
    padding: 6px 12px;
    font-size: 13px;
    cursor: pointer;
    transition: border-color 0.2s;
  }

  .saved-chip:active {
    border-color: var(--accent2);
  }

  .saved-chip .del-btn {
    color: var(--text-muted);
    font-size: 16px;
    line-height: 1;
    padding: 0 2px;
  }

  .hidden { display: none !important; }

  /* 직접입력 버튼 (상단 고정) */
  .quick-input-bar {
    padding: 10px 14px;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
  }

  .quick-input-btn {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    width: 100%;
    padding: 13px 16px;
    border-radius: 14px;
    border: 2px dashed var(--accent2);
    background: rgba(244,114,182,0.08);
    color: var(--accent2);
    font-family: inherit;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.2s;
    letter-spacing: -0.3px;
  }

  .quick-input-btn:active {
    background: rgba(244,114,182,0.2);
    transform: scale(0.98);
  }

  body.light .quick-input-btn {
    background: rgba(219,39,119,0.06);
  }

  /* 직접입력 모달 */
  .input-modal {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.7);
    z-index: 1500;
    justify-content: flex-end;
    flex-direction: column;
  }

  .input-modal.show {
    display: flex;
    animation: slideUpModal 0.25s ease;
  }

  @keyframes slideUpModal {
    from { opacity: 0; transform: translateY(60px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .input-modal-box {
    background: var(--surface);
    border-radius: 24px 24px 0 0;
    padding: 20px 16px 36px;
    border-top: 2px solid var(--border);
  }

  .input-modal-handle {
    width: 40px;
    height: 4px;
    background: var(--border);
    border-radius: 50px;
    margin: 0 auto 16px;
  }

  .input-modal-title {
    font-size: 16px;
    font-weight: 700;
    color: var(--accent2);
    margin-bottom: 14px;
    text-align: center;
  }

  .input-modal-row {
    display: flex;
    gap: 8px;
    margin-bottom: 10px;
  }

  .input-modal input {
    flex: 1;
    padding: 13px 16px;
    border-radius: 12px;
    border: 2px solid var(--border);
    background: var(--card);
    color: var(--text);
    font-family: inherit;
    font-size: 15px;
    outline: none;
    transition: border-color 0.2s;
  }

  .input-modal input:focus { border-color: var(--accent2); }
  .input-modal input::placeholder { color: var(--text-muted); }

  .input-modal .emoji-inp {
    width: 62px;
    flex: none;
    text-align: center;
    font-size: 22px;
  }

  .input-modal-actions {
    display: flex;
    gap: 8px;
    margin-top: 4px;
  }

  .btn-modal-show {
    flex: 2;
    padding: 14px;
    border-radius: 12px;
    border: none;
    background: var(--accent2);
    color: white;
    font-family: inherit;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    transition: opacity 0.2s;
  }

  .btn-modal-save {
    flex: 1;
    padding: 14px;
    border-radius: 12px;
    border: 2px solid #4ade80;
    background: transparent;
    color: #4ade80;
    font-family: inherit;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
  }

  .voice-type-bar {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 14px;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    flex-wrap: wrap;
  }

  /* 모달 음성 재생 버튼 */
  .btn-speak {
    display: block;
    margin: 12px auto 0;
    padding: 10px 28px;
    border-radius: 50px;
    border: 2px solid #38bdf8;
    background: transparent;
    color: #38bdf8;
    font-family: inherit;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.2s;
  }
  .btn-speak:active { background: rgba(56,189,248,0.15); }
  .btn-speak.speaking {
    background: #38bdf8;
    color: #0f172a;
    animation: pulse 1s infinite;
  }
  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.6; }
  }

  /* 길게 누르기 삭제 팝업 */
  .context-menu {
    display: none;
    position: fixed;
    z-index: 2000;
    background: var(--surface);
    border: 2px solid var(--border);
    border-radius: 16px;
    overflow: hidden;
    box-shadow: 0 8px 32px rgba(0,0,0,0.4);
    min-width: 200px;
  }

  .context-menu.show { display: block; animation: fadeIn 0.12s ease; }

  .context-menu-title {
    padding: 12px 16px 8px;
    font-size: 12px;
    color: var(--text-muted);
    font-weight: 700;
    border-bottom: 1px solid var(--border);
  }

  .context-menu-btn {
    display: flex;
    align-items: center;
    gap: 10px;
    width: 100%;
    padding: 14px 16px;
    border: none;
    background: transparent;
    color: var(--text);
    font-family: inherit;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    text-align: left;
    transition: background 0.15s;
  }

  .context-menu-btn:active { background: var(--card); }
  .context-menu-btn.danger { color: #f87171; }
  .context-menu-btn.star { color: #f59e0b; }
  .context-menu-btn.restore { color: #4ade80; }

  .context-overlay {
    display: none;
    position: fixed;
    inset: 0;
    z-index: 1999;
    background: rgba(0,0,0,0.3);
  }
  .context-overlay.show { display: block; }

  /* 카드 길게 누를 때 흔들림 효과 */
  .card.pressing {
    animation: pressing 0.5s ease forwards;
  }
  @keyframes pressing {
    0% { transform: scale(1); }
    50% { transform: scale(0.94); }
    100% { transform: scale(0.96); box-shadow: 0 0 0 3px var(--accent2); }
  }

  /* ===== 언어 선택 바 ===== */
  .lang-bar {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    padding: 8px 14px 10px;
    background: #f8fafc;
    border-bottom: 1px solid var(--border);
    flex-wrap: wrap;
  }
  .lang-label {
    font-size: 12px;
    color: var(--text-muted);
    font-weight: 600;
    margin-right: 2px;
  }
  .lang-btn {
    padding: 5px 11px;
    border-radius: 50px;
    border: 2px solid var(--border);
    background: transparent;
    color: var(--text-muted);
    font-family: inherit;
    font-size: 12px;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.2s;
    white-space: nowrap;
  }
  .lang-btn.active {
    background: var(--accent2);
    border-color: var(--accent2);
    color: #fff;
  }

  /* ===== 번역 로딩 스피너 ===== */
  .translate-spinner {
    display: inline-block;
    width: 14px;
    height: 14px;
    border: 2px solid rgba(2,132,199,0.3);
    border-top-color: #0284c7;
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
    vertical-align: middle;
    margin-right: 4px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  @media (orientation: landscape) and (max-height: 500px) {
    .display-modal { padding: 12px; align-items: center; }
    .display-card {
      max-width: 100%;
      width: 100%;
      padding: 20px 24px 16px;
      display: flex;
      flex-direction: row;
      align-items: center;
      justify-content: center;
      gap: 20px;
      border-radius: 18px;
    }
    .display-card .big-emoji { font-size: 60px; margin-bottom: 0; flex-shrink: 0; }
    .display-card .big-text  { font-size: 38px; margin-bottom: 0; }
    .modal-close-btn { top: 8px; right: 8px; }
    .btn-speak { margin-top: 0; }
  }

  .restore-bar {
    display: none;
    align-items: center;
    justify-content: center;
    gap: 8px;
    padding: 8px 16px;
    background: #1a2e1a;
    border-top: 1px solid #4ade80;
    position: fixed;
    bottom: 0;
    left: 0; right: 0;
    z-index: 500;
    font-size: 13px;
  }

  body.light .restore-bar { background: #f0fdf4; border-color: #4ade80; }
  .restore-bar.show { display: flex; animation: slideUp 0.2s ease; }
  @keyframes slideUp {
    from { transform: translateY(100%); }
    to { transform: translateY(0); }
  }

  .restore-bar span { color: #4ade80; font-weight: 600; }
  .btn-restore {
    padding: 6px 14px;
    border-radius: 50px;
    border: 2px solid #4ade80;
    background: transparent;
    color: #4ade80;
    font-family: inherit;
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
  }
</style>
</head>
<body>

<!-- 버전 선택 화면 -->
<div class="version-overlay" id="versionOverlay">
  <div class="version-title" id="versionTitle">🤟 버전을 선택해 주세요</div>
  <div class="version-subtitle" id="versionSubtitle">언제든지 헤더의 버튼으로 바꿀 수 있어요</div>

  <!-- 언어 선택 -->
  <div class="version-lang-bar">
    <button class="version-lang-btn active" id="vlang-ko" onclick="setVersionLang('ko')">🇰🇷 한국어</button>
    <button class="version-lang-btn" id="vlang-en" onclick="setVersionLang('en')">🇺🇸 English</button>
    <button class="version-lang-btn" id="vlang-ja" onclick="setVersionLang('ja')">🇯🇵 日本語</button>
    <button class="version-lang-btn" id="vlang-zh" onclick="setVersionLang('zh')">🇨🇳 中文</button>
    <button class="version-lang-btn" id="vlang-es" onclick="setVersionLang('es')">🇪🇸 Español</button>
    <button class="version-lang-btn" id="vlang-fr" onclick="setVersionLang('fr')">🇫🇷 Français</button>
    <button class="version-lang-btn" id="vlang-de" onclick="setVersionLang('de')">🇩🇪 Deutsch</button>
  </div>

  <div class="version-cards">

    <!-- 이모지 있는 버전 -->
    <div class="version-card" id="vc-emoji">
      <div class="version-card-title" id="vEmojiTitle">😊 이모지 있는 버전</div>
      <div class="preview-grid" id="preview-emoji-grid">
        <div class="preview-card"><span class="pe">📋</span><span class="pt" id="prev-e-0">메뉴판 보여주세요</span></div>
        <div class="preview-card"><span class="pe">💳</span><span class="pt" id="prev-e-1">카드로 결제할게요</span></div>
        <div class="preview-card"><span class="pe">👂🚫</span><span class="pt" id="prev-e-2">저는 청각장애인입니다</span></div>
        <div class="preview-card"><span class="pe">🙏</span><span class="pt" id="prev-e-3">감사합니다</span></div>
      </div>
      <button class="btn-select-version" onclick="selectVersion('emoji')" id="vBtnEmoji">선택</button>
    </div>

    <!-- 이모지 없는 버전 -->
    <div class="version-card" id="vc-text">
      <div class="version-card-title" id="vTextTitle">📝 이모지 없는 버전</div>
      <div class="preview-grid" id="preview-text-grid">
        <div class="preview-card" style="min-height:58px"><span class="pt" style="font-size:12px;font-weight:700" id="prev-t-0">메뉴판 보여주세요</span></div>
        <div class="preview-card" style="min-height:58px"><span class="pt" style="font-size:12px;font-weight:700" id="prev-t-1">카드로 결제할게요</span></div>
        <div class="preview-card" style="min-height:58px"><span class="pt" style="font-size:12px;font-weight:700" id="prev-t-2">저는 청각장애인입니다</span></div>
        <div class="preview-card" style="min-height:58px"><span class="pt" style="font-size:12px;font-weight:700" id="prev-t-3">감사합니다</span></div>
      </div>
      <button class="btn-select-version" onclick="selectVersion('text')" id="vBtnText">선택</button>
    </div>

  </div>
</div>

<header>
  <h1 id="headerTitle">🤟 의사소통 카드</h1>
  <button class="btn-change-version" id="btnChangeVersion" onclick="openVersionSelect()">버전 변경</button>
</header>

<!-- 설정 바 -->
<div class="settings-bar">
  <span class="settings-label" id="labelFont">🔤 글씨</span>
  <div class="toggle-group">
    <button class="toggle-btn active" id="btn-sm" onclick="setFont('sm')">작게</button>
    <button class="toggle-btn" id="btn-lg" onclick="setFont('lg')">크게</button>
  </div>
  <div class="divider"></div>
  <span class="settings-label" id="labelVoice">🔊 음성</span>
  <div class="toggle-group">
    <button class="toggle-btn" id="btn-voice-on" onclick="setVoice('on')">켜기</button>
    <button class="toggle-btn active" id="btn-voice-off" onclick="setVoice('off')">끄기</button>
  </div>
</div>

<!-- 언어 선택 바 -->
<div class="lang-bar">
  <span class="lang-label" id="labelLang">🌐 언어</span>
  <button class="lang-btn active" id="lang-ko" onclick="setLang('ko')">🇰🇷 한국어</button>
  <button class="lang-btn" id="lang-en" onclick="setLang('en')">🇺🇸 English</button>
  <button class="lang-btn" id="lang-ja" onclick="setLang('ja')">🇯🇵 日本語</button>
  <button class="lang-btn" id="lang-zh" onclick="setLang('zh')">🇨🇳 中文</button>
  <button class="lang-btn" id="lang-es" onclick="setLang('es')">🇪🇸 Español</button>
  <button class="lang-btn" id="lang-fr" onclick="setLang('fr')">🇫🇷 Français</button>
  <button class="lang-btn" id="lang-de" onclick="setLang('de')">🇩🇪 Deutsch</button>
</div>

<div class="quick-input-bar">
  <button class="quick-input-btn" id="btnQuickInput" onclick="openInputModal()">
    ✏️ 직접 입력해서 보여주기
  </button>
</div>

<div style="padding: 0 14px 10px;">
  <button class="caption-launch-btn" id="btnCaptionLaunch" onclick="openCaptionScreen()">
    🎙️ 상대방 말 실시간 자막으로 보기
  </button>
</div>

<div class="search-bar">
  <input type="text" id="searchInput" placeholder="🔍 카드 검색..." oninput="filterCards()">
</div>

<!-- 자주 쓰는 카드 영역 -->
<div id="favoriteBar" style="display:none; padding: 10px 14px 4px; background: var(--surface); border-bottom: 1px solid var(--border);">
  <div id="favoriteTitleEl" style="font-size:12px; font-weight:700; color:#f59e0b; margin-bottom:8px;">⭐ 자주 쓰는 카드</div>
  <div id="favoriteChips" style="display:flex; flex-wrap:wrap; gap:8px;"></div>
</div>

<div class="tabs" id="tabs">
  <button class="tab active" id="tabAll" onclick="filterTab('all', this)">전체</button>
  <button class="tab" onclick="filterTab('소통', this)">💬 소통</button>
  <button class="tab" onclick="filterTab('카페', this)">☕ 카페</button>
  <button class="tab" onclick="filterTab('식당', this)">🍽️ 식당</button>
  <button class="tab" onclick="filterTab('쇼핑', this)">🛒 쇼핑</button>
  <button class="tab" onclick="filterTab('병원', this)">🏥 병원</button>

  <button class="tab" onclick="filterTab('직장', this)">💼 직장</button>
  <button class="tab" onclick="filterTab('숙박', this)">🏨 숙박</button>
  <button class="tab" onclick="filterTab('은행', this)">🏦 은행</button>
  <button class="tab" onclick="filterTab('관공서', this)">🏛️ 관공서</button>
  <button class="tab" onclick="filterTab('긴급', this)">🚨 긴급</button>

<div id="allContent">
</div>


<!-- 실시간 자막 모달 -->
<div class="caption-screen" id="captionScreen" onclick="closeCaptionScreen()">
  <div class="caption-modal" onclick="event.stopPropagation()">
    <div class="caption-header">
      <div class="caption-header-title">
        <span id="captionScreenTitle">🎙️ 실시간 자막</span>
        <div class="caption-status" id="captionStatus">
          <span class="dot off" id="captionDot"></span>
          <span id="captionStatusText">대기 중</span>
        </div>
      </div>
      <button class="caption-close-btn" onclick="closeCaptionScreen()">✕</button>
    </div>

    <div class="caption-body">
      <div class="caption-final" id="captionFinal">상대방의 말이 여기에 자막으로 나타납니다</div>
      <div class="caption-interim" id="captionInterim"></div>
    </div>

    <!-- ===== 번역 버튼 (자막 화면) ===== -->
    <div class="caption-translate-btns" id="captionTranslateBtns">
      <!-- JS로 동적 생성 -->

<!-- 직접입력 모달 -->
<div class="input-modal" id="inputModal" onclick="closeInputModal()">
  <div class="input-modal-box" onclick="event.stopPropagation()">
    <div class="input-modal-handle"></div>

      <input type="text" class="emoji-inp" id="modalCustomEmoji" placeholder="😊" maxlength="2">
      <input type="text" id="modalCustomText" placeholder="전하고 싶은 말을 입력하세요..."

    <div class="input-modal-actions">
      <button class="btn-modal-show" id="btnModalShow" onclick="modalShowCustom()">📢 보여주기</button>
      <button class="btn-modal-save" id="btnModalSave" onclick="modalSaveCustom()">💾 저장</button>
      <button class="btn-modal-save" id="btnModalFavorite" onclick="modalFavoriteCustom()" style="border-color:#f59e0b; color:#f59e0b;">⭐ 자주</button>

  </div>

<div class="display-modal" id="modal" onclick="closeModal()">

    <span class="big-emoji" id="modalEmoji">🙏</span>
    <div class="big-text" id="modalText"></div>
    <button class="btn-speak" id="btnSpeak" onclick="speakModalText()" style="display:none">🔊 다시 듣기</button>

    <!-- ===== 번역 버튼 영역 ===== -->
    <div class="modal-translate-section">

// 현재 언어
let currentLang = 'ko';
let cards = allCards.ko;

// ── 현재 카드 위치 추적 ──────────────────────
// 카드 클릭 시 저장: { catIndex, cardIndex } 또는 null(직접입력)
let currentCardPosition = null;

// 카드 인덱스로 다른 언어 텍스트 찾기
function getCardTextByLang(targetLang, catIndex, cardIndex) {
  const catKey = catNames[targetLang][catIndex];
  const catData = allCards[targetLang][catKey];
  if (!catData || !catData[cardIndex]) return null;
  return catData[cardIndex][1];
}

// ── 번역 캐시 (직접입력용) ──────────────────
const translateCache = {};

// MyMemory 무료 번역 API - 직접 입력한 문장에만 사용
async function translateFreeText(text, targetLang) {
  const cacheKey = text + '__' + currentLang + '__' + targetLang;
  if (translateCache[cacheKey]) return translateCache[cacheKey];

  const langCode = { ko: 'ko', en: 'en', ja: 'ja', zh: 'zh-CN', es: 'es', fr: 'fr', de: 'de' };
  const from = langCode[currentLang];
  const to = langCode[targetLang];

  const url = 'https://api.mymemory.translated.net/get?q=' + encodeURIComponent(text) + '&langpair=' + from + '|' + to;
  const response = await fetch(url);
  const data = await response.json();

  const result = data?.responseData?.translatedText?.trim() || text;
  translateCache[cacheKey] = result;
  return result;
}

// 스마트 번역: 카드면 데이터에서, 직접입력이면 API 사용
async function translateWithClaude(text, targetLang) {
  if (currentCardPosition !== null) {
    const { catIndex, cardIndex } = currentCardPosition;
    const found = getCardTextByLang(targetLang, catIndex, cardIndex);
    if (found) return found;
  }
  // 직접 입력이거나 카드 데이터를 못 찾은 경우 → API 번역
  return await translateFreeText(text, targetLang);
}

// 모달 번역 버튼 생성 (현재 언어 제외한 나머지 3개)
function buildModalTranslateBtns() {
  const container = document.getElementById('modalTranslateBtns');
  container.innerHTML = '';
  const allLangs = ['ko', 'en', 'ja', 'zh', 'es', 'fr', 'de'];
  allLangs.filter(l => l !== currentLang).forEach(lang => {
    const btn = document.createElement('button');
    btn.className = 'modal-translate-btn';
    btn.textContent = langInfo[lang].flag + ' ' + langInfo[lang].name;
    btn.dataset.lang = lang;
    btn.onclick = () => handleModalTranslate(lang, btn);
    container.appendChild(btn);
  });
}

// 모달에서 번역 실행
let currentTranslatedText = '';
let currentTranslatedLang = '';

async function handleModalTranslate(targetLang, btn) {
  // 이미 선택된 언어면 토글 off
  if (btn.classList.contains('active')) {
    btn.classList.remove('active');
    document.getElementById('modalTranslationBox').classList.remove('show');
    currentTranslatedText = '';
    currentTranslatedLang = '';
    document.getElementById('modalTranslationSpeakBtn').style.display = 'none';
    return;
  }

  // 다른 버튼 모두 비활성화
  document.querySelectorAll('.modal-translate-btn').forEach(b => b.classList.remove('active', 'loading'));
  btn.classList.add('active', 'loading');

  const originalText = document.getElementById('modalText').textContent;
  const box = document.getElementById('modalTranslationBox');
  const textEl = document.getElementById('modalTranslationText');
  const langEl = document.getElementById('modalTranslationLang');

  textEl.innerHTML = '<span class="translate-spinner"></span>';
  box.classList.add('show');

  try {
    const translated = await translateWithClaude(originalText, targetLang);
    currentTranslatedText = translated;
    currentTranslatedLang = targetLang;
    langEl.textContent = langInfo[targetLang].flag + ' ' + langInfo[targetLang].name;
    textEl.textContent = translated;
    btn.classList.remove('loading');

    const speakBtn = document.getElementById('modalTranslationSpeakBtn');
    speakBtn.style.display = voiceEnabled ? 'inline-block' : 'none';
    speakBtn.textContent = uiText[currentLang].speakTranslation;

    // 음성 자동 재생
    if (voiceEnabled) speakLang(translated, targetLang);
  } catch (e) {
    textEl.textContent = '번역 중 오류가 발생했어요.';
    btn.classList.remove('active', 'loading');
  }
}

function speakTranslation() {
  if (currentTranslatedText && currentTranslatedLang) {
    speakLang(currentTranslatedText, currentTranslatedLang);
  }
}

// 자막 화면 번역 버튼 생성
function buildCaptionTranslateBtns() {
  const container = document.getElementById('captionTranslateBtns');
  container.innerHTML = '';

  const label = document.createElement('span');
  label.style.cssText = 'font-size:12px;color:#64748b;font-weight:600;white-space:nowrap;';
  label.textContent = uiText[currentLang].captionTranslateHint + ':';
  container.appendChild(label);

  const allLangs = ['ko', 'en', 'ja', 'zh', 'es', 'fr', 'de'];
  allLangs.forEach(lang => {
    const btn = document.createElement('button');
    btn.className = 'caption-translate-btn';
    btn.textContent = langInfo[lang].flag + ' ' + langInfo[lang].name;
    btn.dataset.lang = lang;
    btn.onclick = () => handleCaptionTranslate(lang, btn);
    container.appendChild(btn);
  });
}

// 자막 번역 실행
async function handleCaptionTranslate(targetLang, btn) {
  const captionText = document.getElementById('captionFinal').textContent.trim();
  const placeholderTexts = Object.values(uiText).map(u => u.captionPlaceholder);
  if (!captionText || placeholderTexts.includes(captionText)) {
    return;
  }

  // 같은 버튼 다시 누르면 닫기
  if (btn.classList.contains('active')) {
    btn.classList.remove('active');
    document.getElementById('captionTranslationResult').classList.remove('show');
    return;
  }

  document.querySelectorAll('.caption-translate-btn').forEach(b => b.classList.remove('active', 'loading'));
  btn.classList.add('active', 'loading');

  const resultBox = document.getElementById('captionTranslationResult');
  const resultText = document.getElementById('captionTranslationText');
  const resultLang = document.getElementById('captionTranslationLang');

  resultText.innerHTML = '<span style="color:#94a3b8">번역 중...</span>';
  resultBox.classList.add('show');

  try {
    const translated = await translateWithClaude(captionText, targetLang);
    resultLang.textContent = langInfo[targetLang].flag + ' ' + langInfo[targetLang].name;
    resultText.textContent = translated;
    btn.classList.remove('loading');
  } catch (e) {
    resultText.textContent = '번역 오류';
    btn.classList.remove('active', 'loading');
  }
}

// 언어 전환
function setLang(lang) {
  currentLang = lang;
  localStorage.setItem('lang', lang);
  cards = allCards[lang];

  ['ko','en','ja','zh','es','fr','de'].forEach(l => {
    document.getElementById('lang-' + l).classList.toggle('active', l === lang);
  });

  if (recognition) {
    const langMap = { ko:'ko-KR', en:'en-US', ja:'ja-JP', zh:'zh-CN', es:'es-ES', fr:'fr-FR', de:'de-DE' };
    recognition.lang = langMap[lang] || 'ko-KR';
  }

  applyUIText();
  rebuildSections();
  renderCards();
  renderSaved();
  applyEmojiMode();
  buildModalTranslateBtns();
  buildCaptionTranslateBtns();
}

// 섹션과 탭 재구성
function rebuildSections() {
  const names = catNames[currentLang];
  const tabsEl = document.getElementById('tabs');
  const contentEl = document.getElementById('allContent');
  const t = uiText[currentLang];

  tabsEl.innerHTML = `<button class="tab active" id="tabAll" onclick="filterTab('all', this)">${t.tabAll}</button>`;
  names.forEach((name, i) => {
    tabsEl.innerHTML += `<button class="tab" onclick="filterTab('${name}', this)">${catEmojis[i]} ${name}</button>`;
  });

  contentEl.innerHTML = '';
  names.forEach((name, i) => {
    contentEl.innerHTML += `
      <div class="section" data-cat="${name}">
        <div class="section-title"><span class="emoji">${catEmojis[i]}</span> ${name}</div>
        <div class="card-grid" id="grid-${name}"></div>
      </div>`;
  });
  contentEl.innerHTML += `
    <div class="section" id="savedSection">
      <div class="section-title"><span class="emoji">💾</span> <span id="savedSectionTitle">${t.savedTitle}</span></div>
      <div class="saved-custom" id="savedCustom"></div>
    </div>`;
}

// 숨긴 카드 목록 불러오기
let hiddenCards = JSON.parse(localStorage.getItem('hiddenCards') || '[]');
let lastDeleted = null;
let restoreTimer = null;

// 카드 렌더링
function renderCards() {
  const names = catNames[currentLang];
  Object.keys(cards).forEach(cat => {
    const grid = document.getElementById('grid-' + cat);
    if (!grid) return;
    const catIndex = names.indexOf(cat);
    grid.innerHTML = cards[cat]
      .map(([emoji, text], originalIndex) => {
        if (isHidden(cat, text)) return '';
        return `<div class="card"
          oncontextmenu="return false"
          data-cat="${cat}"
          data-cat-index="${catIndex}"
          data-card-index="${originalIndex}"
          data-text="${text.replace(/&/g,'&amp;').replace(/"/g,'&quot;')}"
          data-emoji="${emoji}">
          <span class="card-emoji">${emoji}</span>
          <span class="card-text">${text}</span>
        </div>`;
      }).join('');


    grid.querySelectorAll('.card').forEach(card => {
      // click → showCard (data 속성에서 안전하게 읽기)
      card.addEventListener('click', () => {
        const emoji = card.dataset.emoji;
        const text = card.dataset.text;
        const catIndex = parseInt(card.dataset.catIndex);
        const cardIndex = parseInt(card.dataset.cardIndex);
        showCard(emoji, text, catIndex, cardIndex);
      });

      let pressTimer;
      card.addEventListener('touchstart', e => {
        card.classList.add('pressing');
        pressTimer = setTimeout(() => {
          card.classList.remove('pressing');
          openContextMenu(e.touches[0].clientX, e.touches[0].clientY, card);
        }, 600);
      }, { passive: true });
      card.addEventListener('touchend', () => {
        clearTimeout(pressTimer);
        card.classList.remove('pressing');
      });
      card.addEventListener('touchmove', () => {
        clearTimeout(pressTimer);
        card.classList.remove('pressing');
      });
      card.addEventListener('mousedown', e => {
        if (e.button !== 0) return;
        pressTimer = setTimeout(() => {
          openContextMenu(e.clientX, e.clientY, card);
        }, 600);
      });
      card.addEventListener('mouseup', () => clearTimeout(pressTimer));
      card.addEventListener('mouseleave', () => clearTimeout(pressTimer));
    });
  });
}

function isHidden(cat, text) {
  return hiddenCards.some(h => h.cat === cat && h.text === text);
}

let ctxTarget = null;
function openContextMenu(x, y, card) {
  ctxTarget = card;
  const menu = document.getElementById('ctxMenu');
  document.getElementById('ctxTitle').textContent = card.dataset.emoji + ' ' + card.dataset.text;
  document.getElementById('ctxOverlay').classList.add('show');

  menu.style.display = 'block';
  const mw = menu.offsetWidth;
  const mh = menu.offsetHeight;
  let left = x - mw / 2;
  let top = y - mh - 10;
  if (left < 8) left = 8;
  if (left + mw > window.innerWidth - 8) left = window.innerWidth - mw - 8;
  if (top < 60) top = y + 10;
  menu.style.left = left + 'px';
  menu.style.top = top + 'px';
  menu.style.display = '';
  menu.classList.add('show');
}

function closeContextMenu() {
  document.getElementById('ctxMenu').classList.remove('show');
  document.getElementById('ctxOverlay').classList.remove('show');
  ctxTarget = null;
}

function ctxShow() {
  if (!ctxTarget) return;
  const catIndex = parseInt(ctxTarget.dataset.catIndex ?? '-1');
  const cardIndex = parseInt(ctxTarget.dataset.cardIndex ?? '-1');
  showCard(ctxTarget.dataset.emoji, ctxTarget.dataset.text, catIndex, cardIndex);
  closeContextMenu();
}

function ctxDelete() {
  if (!ctxTarget) return;
  const cat = ctxTarget.dataset.cat;
  const text = ctxTarget.dataset.text;
  const emoji = ctxTarget.dataset.emoji;
  lastDeleted = { cat, text, emoji };
  hiddenCards.push({ cat, text, emoji });
  localStorage.setItem('hiddenCards', JSON.stringify(hiddenCards));
  closeContextMenu();
  renderCards();
  showRestoreBar();
}

function showRestoreBar() {
  const bar = document.getElementById('restoreBar');
  bar.classList.add('show');
  clearTimeout(restoreTimer);
  restoreTimer = setTimeout(() => bar.classList.remove('show'), 5000);
}

function undoDelete() {
  if (!lastDeleted) return;
  hiddenCards = hiddenCards.filter(h => !(h.cat === lastDeleted.cat && h.text === lastDeleted.text));
  localStorage.setItem('hiddenCards', JSON.stringify(hiddenCards));
  lastDeleted = null;
  renderCards();
  document.getElementById('restoreBar').classList.remove('show');
}

function showHiddenManager() {
  document.getElementById('restoreBar').classList.remove('show');
  if (hiddenCards.length === 0) { alert('숨긴 카드가 없어요!'); return; }
  const list = hiddenCards.map((h, i) =>
    `<div style="display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--border)">
      <span style="font-size:15px">${h.emoji} ${h.text}</span>
      <button onclick="restoreCard(${i})" style="padding:4px 12px;border-radius:50px;border:2px solid #4ade80;background:transparent;color:#4ade80;font-family:inherit;font-size:12px;font-weight:700;cursor:pointer;">복원</button>
    </div>`
  ).join('');

  document.getElementById('modalEmoji').textContent = '🗑️';
  document.getElementById('modalText').innerHTML = `<div style="font-size:16px;font-weight:700;margin-bottom:12px">숨긴 카드 목록</div><div style="text-align:left">${list}</div>`;
  document.getElementById('modal').classList.add('show');
}

function restoreCard(i) {
  hiddenCards.splice(i, 1);
  localStorage.setItem('hiddenCards', JSON.stringify(hiddenCards));
  renderCards();
  closeModal();
}

// ── 실시간 자막 ──────────────────────────────
let recognition = null;
let isListening = false;
let finalText = '';

function updateCaptionSize(val) {
  document.getElementById('captionScreen').style.setProperty('--caption-font-size', val + 'px');
  document.getElementById('captionSizeValue').textContent = val + 'px';
  localStorage.setItem('captionFontSize', val);
}

function openCaptionScreen() {
  document.getElementById('captionScreen').classList.add('show');
  finalText = '';
  document.getElementById('captionFinal').textContent = uiText[currentLang].captionPlaceholder;
  document.getElementById('captionInterim').textContent = '';
  document.getElementById('captionTranslationResult').classList.remove('show');
  document.querySelectorAll('.caption-translate-btn').forEach(b => b.classList.remove('active'));
  const savedSize = localStorage.getItem('captionFontSize') || '52';
  document.getElementById('captionSizeSlider').value = savedSize;
  updateCaptionSize(savedSize);
  buildCaptionTranslateBtns();
}

function closeCaptionScreen() {
  stopListening();
  document.getElementById('captionScreen').classList.remove('show');
}

function clearCaption() {
  finalText = '';
  lastFinalText = '';
  document.getElementById('captionFinal').textContent = '';
  document.getElementById('captionInterim').textContent = '';
  document.getElementById('captionTranslationResult').classList.remove('show');
  document.querySelectorAll('.caption-translate-btn').forEach(b => b.classList.remove('active'));
}

function toggleListening() {
  if (isListening) {
    stopListening();
  } else {
    startListening();
  }
}

function startListening() {
  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SpeechRecognition) {
    alert('이 브라우저는 음성 인식을 지원하지 않아요.\n크롬(Chrome) 브라우저를 사용해 주세요.');
    return;
  }

  recognition = new SpeechRecognition();
  const langMap = { ko: 'ko-KR', en: 'en-US', ja: 'ja-JP', zh: 'zh-CN' };
  recognition.lang = langMap[currentLang] || 'ko-KR';
  recognition.continuous = true;
  recognition.interimResults = true;

  recognition.onstart = () => {
    isListening = true;
    document.getElementById('captionDot').classList.remove('off');
    document.getElementById('captionStatusText').textContent = uiText[currentLang].captionListening;
    document.getElementById('btnCaptionToggle').textContent = uiText[currentLang].captionStop;
    document.getElementById('btnCaptionToggle').classList.add('listening');
    const placeholderTexts = Object.values(uiText).map(u => u.captionPlaceholder);
    if (placeholderTexts.includes(document.getElementById('captionFinal').textContent)) {
      document.getElementById('captionFinal').textContent = '';
    }
  };

  // 안드로이드 중복 방지용 변수
  let lastFinalText = '';

  recognition.onresult = (event) => {
    let interim = '';
    for (let i = event.resultIndex; i < event.results.length; i++) {
      const transcript = event.results[i][0].transcript.trim();
      if (event.results[i].isFinal) {
        // 안드로이드 중복 방지: 이미 finalText에 포함된 내용이면 무시
        if (transcript && !finalText.trimEnd().endsWith(transcript)) {
          finalText += transcript + ' ';
        }
      } else {
        // interim 중복 방지: finalText 끝부분과 겹치는 내용 제거
        const trimmedFinal = finalText.trim();
        if (trimmedFinal && transcript.startsWith(trimmedFinal.slice(-Math.min(20, trimmedFinal.length)))) {
          // 겹치는 부분 제거
          const overlap = trimmedFinal.slice(-Math.min(20, trimmedFinal.length));
          interim += transcript.replace(overlap, '').trim();
        } else {
          interim += transcript;
        }
      }
    }
    document.getElementById('captionFinal').textContent = finalText;
    document.getElementById('captionInterim').textContent = interim;
    const el = document.getElementById('captionFinal');
    el.scrollTop = el.scrollHeight;

    // 번역 버튼이 활성화된 상태면 자동 재번역 (내용 바뀔 때만)
    const activeBtn = document.querySelector('.caption-translate-btn.active');
    if (activeBtn && finalText.trim() && finalText !== lastFinalText) {
      lastFinalText = finalText;
      handleCaptionTranslate(activeBtn.dataset.lang, activeBtn);
    }
  };

  recognition.onerror = (event) => {
    if (event.error === 'not-allowed') {
      alert('마이크 권한이 필요해요.\n브라우저 설정에서 마이크를 허용해 주세요.');
    }
    stopListening();
  };

  recognition.onend = () => {
    if (isListening) recognition.start();
  };

  recognition.start();
}

function stopListening() {
  isListening = false;
  if (recognition) {
    recognition.onend = null;
    recognition.stop();
    recognition = null;
  }
  document.getElementById('captionDot').classList.add('off');
  document.getElementById('captionStatusText').textContent = uiText[currentLang].captionWait;
  document.getElementById('btnCaptionToggle').textContent = uiText[currentLang].captionStart;
  document.getElementById('btnCaptionToggle').classList.remove('listening');
  document.getElementById('captionInterim').textContent = '';
}

// ── 음성 합성 ──────────────────────────────
let voiceEnabled = false;

function speakLang(text, lang) {
  if (typeof speechSynthesis === 'undefined') return;
  speechSynthesis.cancel();
  const utter = new SpeechSynthesisUtterance(text);
  const langMap = { ko:'ko-KR', en:'en-US', ja:'ja-JP', zh:'zh-CN', es:'es-ES', fr:'fr-FR', de:'de-DE' };
  utter.lang = langMap[lang] || 'ko-KR';
  utter.pitch = 1.0;
  utter.rate = 0.92;
  speechSynthesis.speak(utter);
}

function speak(text) {
  if (!voiceEnabled) return;
  const btn = document.getElementById('btnSpeak');
  if (btn) btn.classList.add('speaking');
  speechSynthesis.cancel();
  const utter = new SpeechSynthesisUtterance(text);
  const langMap = { ko:'ko-KR', en:'en-US', ja:'ja-JP', zh:'zh-CN', es:'es-ES', fr:'fr-FR', de:'de-DE' };
  utter.lang = langMap[currentLang] || 'ko-KR';
  utter.pitch = 1.0;
  utter.rate = 0.92;
  utter.onend = () => { if (btn) btn.classList.remove('speaking'); };
  utter.onerror = () => { if (btn) btn.classList.remove('speaking'); };
  speechSynthesis.speak(utter);
}

function speakModalText() {
  speak(document.getElementById('modalText').textContent);
}

function setVoice(mode) {
  voiceEnabled = (mode === 'on');
  document.getElementById('btn-voice-on').classList.toggle('active', voiceEnabled);
  document.getElementById('btn-voice-off').classList.toggle('active', !voiceEnabled);
  document.getElementById('btnSpeak').style.display = voiceEnabled ? 'block' : 'none';
  localStorage.setItem('voiceEnabled', mode);
}

// ── 카드 표시 모달 ──────────────────────────
function showCard(emoji, text, catIndex, cardIndex) {
  // &#39; 등 HTML 엔티티 디코드
  const decoded = text.replace(/&#39;/g, "'").replace(/&quot;/g, '"').replace(/&amp;/g, '&');
  document.getElementById('modalEmoji').textContent = emoji;
  document.getElementById('modalText').textContent = decoded;
  text = decoded;
  document.getElementById('btnSpeak').style.display = voiceEnabled ? 'block' : 'none';

  // 카드 위치 저장 (카드 클릭이면 저장, 직접입력이면 null)
  if (catIndex !== undefined && catIndex >= 0) {
    currentCardPosition = { catIndex, cardIndex };
  } else {
    currentCardPosition = null;
  }

  // 번역 결과 초기화
  document.getElementById('modalTranslationBox').classList.remove('show');
  document.getElementById('modalTranslationSpeakBtn').style.display = 'none';
  currentTranslatedText = '';
  currentTranslatedLang = '';

  // 번역 버튼 재생성 (현재 언어 반영)
  buildModalTranslateBtns();

  document.getElementById('modal').classList.add('show');
  speak(text);
  applyEmojiMode();
}

function closeModal() {
  speechSynthesis.cancel();
  document.getElementById('modal').classList.remove('show');
}

// 탭 필터
function filterTab(cat, btn) {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  btn.classList.add('active');
  document.querySelectorAll('.section[data-cat]').forEach(s => {
    s.style.display = (cat === 'all' || s.dataset.cat === cat) ? '' : 'none';
  });
  document.getElementById('searchInput').value = '';
}

// 검색 필터
function filterCards() {
  const q = document.getElementById('searchInput').value.trim().toLowerCase();
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.querySelector('.tab').classList.add('active');

  document.querySelectorAll('.section[data-cat]').forEach(section => {
    const cards = section.querySelectorAll('.card');
    let visible = 0;
    cards.forEach(card => {
      const match = card.querySelector('.card-text').textContent.toLowerCase().includes(q);
      card.style.display = (!q || match) ? '' : 'none';
      if (!q || match) visible++;
    });
    section.style.display = (visible > 0 || !q) ? '' : 'none';
  });
}

// 직접입력 모달
function openInputModal() {
  document.getElementById('inputModal').classList.add('show');
  setTimeout(() => document.getElementById('modalCustomText').focus(), 300);
}

function closeInputModal() {
  document.getElementById('inputModal').classList.remove('show');
}

function modalShowCustom() {
  const emoji = document.getElementById('modalCustomEmoji').value || '💬';
  const text = document.getElementById('modalCustomText').value.trim();
  if (!text) { alert('전하고 싶은 말을 입력해주세요!'); return; }
  closeInputModal();
  showCard(emoji, text);
}

function modalSaveCustom() {
  const emoji = document.getElementById('modalCustomEmoji').value || '💬';
  const text = document.getElementById('modalCustomText').value.trim();
  if (!text) { alert('저장할 말을 입력해주세요!'); return; }
  savedItems.push({ emoji, text });
  localStorage.setItem('customCards', JSON.stringify(savedItems));
  renderSaved();
  document.getElementById('modalCustomText').value = '';
  document.getElementById('modalCustomEmoji').value = '';
  closeInputModal();
}

function modalFavoriteCustom() {
  const emoji = document.getElementById('modalCustomEmoji').value || '💬';
  const text = document.getElementById('modalCustomText').value.trim();
  if (!text) { alert('추가할 말을 입력해주세요!'); return; }
  if (favoriteItems.some(f => f.text === text)) {
    alert(uiText[currentLang].favoriteAlready);
    return;
  }
  favoriteItems.push({ emoji, text });
  localStorage.setItem('favoriteCards', JSON.stringify(favoriteItems));
  renderFavorites();
  document.getElementById('modalCustomText').value = '';
  document.getElementById('modalCustomEmoji').value = '';
  closeInputModal();
}

// 저장
let savedItems = JSON.parse(localStorage.getItem('customCards') || '[]');

// ── 자주 쓰는 카드 ──────────────────────────
let favoriteItems = JSON.parse(localStorage.getItem('favoriteCards') || '[]');

function ctxFavorite() {
  if (!ctxTarget) return;
  const emoji = ctxTarget.dataset.emoji;
  const text = ctxTarget.dataset.text;
  if (favoriteItems.some(f => f.text === text)) {
    alert(uiText[currentLang].favoriteAlready);
    closeContextMenu();
    return;
  }
  favoriteItems.push({ emoji, text });
  localStorage.setItem('favoriteCards', JSON.stringify(favoriteItems));
  renderFavorites();
  closeContextMenu();
  // 짧은 안내 토스트
  const bar = document.getElementById('restoreBar');
  bar.querySelector('span').textContent = uiText[currentLang].favoriteAdded;
  bar.classList.add('show');
  clearTimeout(restoreTimer);
  restoreTimer = setTimeout(() => {
    bar.classList.remove('show');
    bar.querySelector('span').textContent = '🗑️ 카드가 숨겨졌어요';
  }, 2500);
}

function deleteFavorite(i) {
  favoriteItems.splice(i, 1);
  localStorage.setItem('favoriteCards', JSON.stringify(favoriteItems));
  renderFavorites();
}

function renderFavorites() {
  const bar = document.getElementById('favoriteBar');
  const chips = document.getElementById('favoriteChips');
  if (favoriteItems.length === 0) {
    bar.style.display = 'none';
    return;
  }
  bar.style.display = '';
  chips.innerHTML = favoriteItems.map((item, i) => {
    return `<div class="saved-chip fav-chip" data-index="${i}" data-emoji="${item.emoji.replace(/"/g,'&quot;')}" data-text="${item.text.replace(/&/g,'&amp;').replace(/"/g,'&quot;')}" style="border-color:#fcd34d; background:#fffbeb;">
      <span>${item.emoji}</span>
      <span style="font-weight:700">${item.text}</span>
      <span class="del-btn fav-del" data-index="${i}">×</span>
    </div>`;
  }).join('');

  // 이벤트 바인딩
  chips.querySelectorAll('.fav-chip').forEach(chip => {
    chip.addEventListener('click', (e) => {
      if (e.target.classList.contains('fav-del')) return;
      showCard(chip.dataset.emoji, chip.dataset.text);
    });
  });
  chips.querySelectorAll('.fav-del').forEach(btn => {
    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      deleteFavorite(parseInt(btn.dataset.index));
    });
  });
}

function deleteCustom(i) {
  savedItems.splice(i, 1);
  localStorage.setItem('customCards', JSON.stringify(savedItems));
  renderSaved();
}

function renderSaved() {
  const container = document.getElementById('savedCustom');
  const section = document.getElementById('savedSection');
  if (savedItems.length === 0) {
    section.style.display = 'none';
    return;
  }
  section.style.display = '';
  container.innerHTML = savedItems.map((item, i) => `
    <div class="saved-chip custom-chip" data-index="${i}" data-emoji="${item.emoji.replace(/"/g,'&quot;')}" data-text="${item.text.replace(/&/g,'&amp;').replace(/"/g,'&quot;')}">
      <span>${item.emoji}</span>
      <span>${item.text}</span>
      <span class="del-btn custom-del" data-index="${i}">×</span>
    </div>
  `).join('');

  container.querySelectorAll('.custom-chip').forEach(chip => {
    chip.addEventListener('click', (e) => {
      if (e.target.classList.contains('custom-del')) return;
      showCard(chip.dataset.emoji, chip.dataset.text);
    });
  });
  container.querySelectorAll('.custom-del').forEach(btn => {
    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      deleteCustom(parseInt(btn.dataset.index));
    });
  });
}

// 글씨 크기 설정
function setFont(size) {
  document.body.classList.toggle('font-lg', size === 'lg');
  document.getElementById('btn-sm').classList.toggle('active', size === 'sm');
  document.getElementById('btn-lg').classList.toggle('active', size === 'lg');
  localStorage.setItem('fontSize', size);
}

// 저장된 설정 불러오기
(function() {
  const savedFont   = localStorage.getItem('fontSize') || 'sm';
  const savedVoice  = localStorage.getItem('voiceEnabled') || 'off';
  const savedEmoji  = localStorage.getItem('emojiMode');
  const savedLang   = localStorage.getItem('lang') || 'ko';

  setLang(savedLang);
  setFont(savedFont);
  setVoice(savedVoice);
  renderFavorites();

  if (!savedEmoji) {
    document.getElementById('versionOverlay').classList.add('show');
  } else {
    emojiMode = savedEmoji;
    applyEmojiMode();
  }
})();
